[project]
name = "command-center"
version = "0.1.0"
description = "Command Center — local execution layer"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "httpx>=0.27",
  "pydantic>=2.8",
  "ruamel.yaml>=0.18",
  "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
cockpit = [
  "PySide6-Essentials>=6.8",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "ruff>=0.6",
]

[project.scripts]
cc = "command_center.cli:main"
ccd = "command_center.daemon:main"
cc-cockpit = "command_center.cockpit.app:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src", "tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/command_center"]
